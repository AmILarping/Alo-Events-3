# ALÓ Events – Netlify-Konfiguration
# Gibt es im Repo schon eine netlify.toml? Dann NICHT ersetzen, sondern nur die Blöcke
# [functions] und [[headers]] unten übernehmen (falls noch nicht vorhanden).

[build]
  # Ordner, aus dem die Website ausgeliefert wird (dort liegen index.html, partys.js und admin/)
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
